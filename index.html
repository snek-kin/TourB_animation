<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>TourB — Cinematic · Phase 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/ui/favicon.svg">
  <link rel="stylesheet" href="src/ui/style.css">
  <!-- Импорт-карта: three и аддоны берутся из vendor/ (работает офлайн, без сборки) -->
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>

    <div id="hud" aria-live="polite">
      <div id="badge" hidden><span class="dot"></span><span id="badge-text"></span></div>
      <div id="caption"></div>
      <div id="disclaimer" hidden></div>
      <div id="paused" hidden>Пауза</div>
      <pre id="debug" hidden></pre>
      <aside id="panel" aria-label="Панель интерфейса (проверка HTML-оверлея)"></aside>
      <div id="notices"></div>
      <pre id="bench" hidden></pre>
    </div>

    <div id="veil"></div>

    <div id="loader">
      <div class="brand">TourB</div>
      <div class="sub">Кинематографичная презентация · Phase 1</div>
      <div class="bar"><i id="loader-bar"></i></div>
      <div id="loader-text">Загрузка…</div>
      <button id="start" hidden>Начать</button>
      <div class="keys">Пробел — пауза · ← → — сцены · D — отладка · F — во весь экран · M — вкл/выкл звук (дорожек пока нет)</div>
    </div>

    <div id="error" hidden></div>
  </div>

  <!-- Конфигурация окружения (PostHog). Классический скрипт: выполняется до src/main.js. Пустые значения = аналитика выключена. -->
  <script src="runtime-config.js"></script>
  <script src="vendor/gsap/gsap.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
